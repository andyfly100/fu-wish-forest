<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>福愿传声，星火成林</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />

  <!-- 公网中文字体 -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet" />

  <style>
    /* ===== 全局样式 ===== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Noto Sans SC", "Microsoft YaHei", sans-serif;
      /* 更喜庆的红金渐变背景 + 轻微纹理感 */
      background:
        radial-gradient(circle at top, rgba(255,255,255,0.4) 0%, transparent 40%),
        radial-gradient(circle at bottom, rgba(255,223,186,0.7) 0%, transparent 45%),
        linear-gradient(180deg, #c40000 0%, #f02b2b 40%, #ff9b3d 100%);
      color: #4a1f1f;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 16px 10px 24px;
    }

    .app-container {
      width: 100%;
      max-width: 720px; /* 更贴合手机宽度 */
      background: rgba(255, 252, 246, 0.96);
      border-radius: 18px;
      box-shadow: 0 12px 40px rgba(80, 0, 0, 0.35);
      border: 2px solid rgba(198, 45, 32, 0.45);
      padding: 16px 14px 20px;
      position: relative;
      overflow: hidden;
    }

    /* 背景淡福字装饰 */
    .app-container::before,
    .app-container::after {
      content: "福";
      position: absolute;
      font-family: "STKaiti", "KaiTi", "SimHei", sans-serif;
      font-size: 60px;
      color: rgba(180, 0, 0, 0.08);
      z-index: 0;
    }
    .app-container::before {
      top: -10px;
      left: 8px;
    }
    .app-container::after {
      bottom: -12px;
      right: 10px;
    }

    .content-layer {
      position: relative;
      z-index: 1;
    }

    /* ===== 标题区 ===== */
    .header {
      text-align: center;
      margin-bottom: 16px;
      padding: 10px 10px 14px;
      border-radius: 14px;
      background: linear-gradient(135deg, #b30000, #e01a1a);
      color: #fff7e6;
      position: relative;
      overflow: hidden;
    }

    .header::before {
      content: "福";
      position: absolute;
      font-family: "STKaiti", "KaiTi", "SimHei", sans-serif;
      font-size: 120px;
      color: rgba(255, 255, 255, 0.08);
      top: -26px;
      left: 50%;
      transform: translateX(-50%) rotate(-18deg);
    }

    .main-title {
      font-family: "STKaiti", "KaiTi", "SimHei", "Noto Sans SC", sans-serif;
      font-size: 28px;        /* 手机端更大 */
      letter-spacing: 4px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.25);
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 13px;
      opacity: 0.9;
    }

    .time-display {
      margin-top: 8px;
      font-size: 12px;
      color: #ffe7c2;
    }

    /* ===== 祝福显示区域 ===== */
    .blessing-section {
      margin-bottom: 14px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 600;
      color: #b30000;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }

    .section-title::before {
      content: "🧧";
      font-size: 16px;
    }

    /* 更中国风的装饰边框 */
    .blessing-card {
      position: relative;
      background: #fffaf0;
      border-radius: 16px;
      padding: 16px 14px 16px;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
      /* 双层描边效果 */
      border: 2px solid #d5a246;
      box-shadow:
        0 0 0 1px rgba(255, 255, 255, 0.7) inset,
        0 12px 26px rgba(135, 60, 0, 0.18);
    }

    /* 内部淡纹理与光晕 */
    .blessing-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at top, rgba(255, 230, 170, 0.6) 0%, transparent 55%),
        radial-gradient(circle at bottom, rgba(255, 210, 150, 0.5) 0%, transparent 55%);
      opacity: 0.9;
      pointer-events: none;
    }

    /* 四角小福字装饰 */
    .blessing-card::after {
      content: "";
      position: absolute;
      inset: 5px;
      border-radius: 12px;
      border: 1px dashed rgba(205, 152, 69, 0.7);
      pointer-events: none;
    }

    .corner-fu {
      position: absolute;
      font-family: "STKaiti", "KaiTi", "SimHei", sans-serif;
      font-size: 14px;
      color: rgba(180, 0, 0, 0.55);
      z-index: 2;
    }
    .corner-fu.tl { top: 4px; left: 8px; }
    .corner-fu.tr { top: 4px; right: 8px; }
    .corner-fu.bl { bottom: 4px; left: 8px; }
    .corner-fu.br { bottom: 4px; right: 8px; }

    .blessing-text {
      position: relative;
      z-index: 1;
      font-size: 15px;
      line-height: 1.7;
      color: #5a2810;
      white-space: pre-wrap;
      text-align: center;
      padding: 0 6px;
    }

    .blessing-author {
      position: relative;
      z-index: 1;
      margin-top: 8px;
      font-size: 13px;
      text-align: right;
      color: #b65a18;
      padding-right: 4px;
    }

    .placeholder {
      font-size: 14px;
      color: #b77b52;
      text-align: center;
    }

    /* 抽取动画效果 */
    .blessing-card.animating {
      animation: card-pop 0.65s ease-out;
    }

    @keyframes card-pop {
      0%   { transform: scale(0.96); box-shadow: 0 0 0 rgba(135, 60, 0, 0.16); }
      50%  { transform: scale(1.02); box-shadow: 0 12px 28px rgba(180, 0, 0, 0.35); }
      100% { transform: scale(1);    box-shadow: 0 12px 26px rgba(135, 60, 0, 0.18); }
    }

    /* ===== 烟花 & 小福字特效 ===== */
    .firework {
      position: absolute;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ffd700;
      box-shadow: 0 0 10px #ffd700;
      pointer-events: none;
      animation: firework-burst 700ms ease-out forwards;
      z-index: 99;
    }

    .firework::before,
    .firework::after {
      content: "福";
      position: absolute;
      font-size: 12px;
      font-family: "STKaiti", "KaiTi", "SimHei", sans-serif;
      color: #b30000;
    }

    .firework::before {
      top: -20px;
      left: -14px;
    }
    .firework::after {
      bottom: -20px;
      right: -14px;
    }

    @keyframes firework-burst {
      0%   { transform: scale(0.5); opacity: 1; }
      60%  { transform: scale(2.4); opacity: 1; }
      100% { transform: scale(3); opacity: 0; }
    }

    /* ===== 按钮区域 ===== */
    .actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .draw-btn {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 40px;
      border-radius: 999px;
      border: 2px solid #ffd36f;
      background: radial-gradient(circle at top, #ffeaa7 0%, #ffd36f 40%, #ffb347 100%);
      color: #7a2500;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 0 #c76a10, 0 10px 18px rgba(184, 81, 0, 0.4);
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.7);
      transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
      width: 100%; /* 手机上按钮占满宽度，方便点击 */
      max-width: 360px;
    }

    .draw-btn:active {
      transform: translateY(3px);
      box-shadow: 0 3px 0 #c76a10, 0 6px 12px rgba(184, 81, 0, 0.35);
      filter: brightness(0.96);
    }

    .draw-btn.disabled {
      cursor: not-allowed;
      opacity: 0.6;
      box-shadow: 0 3px 0 #a8a8a8;
      background: #e0e0e0;
      color: #666;
    }

    .helper-text {
      font-size: 12px;
      color: #9c4d16;
      text-align: center;
    }

    /* ===== 历史记录 ===== */
    .history-section {
      margin-bottom: 12px;
    }

    .history-title {
      font-size: 15px;
      font-weight: 600;
      color: #b30000;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .history-title::before {
      content: "📜";
      font-size: 15px;
    }

    .history-list {
      max-height: 170px;          /* 手机上稍低一点 */
      overflow-y: auto;
      border-radius: 12px;
      border: 1px solid #f1c27d;
      background: rgba(255, 250, 240, 0.9);
      padding: 8px 10px;
      font-size: 13px;
    }

    .history-item {
      padding: 5px 0;
      border-bottom: 1px dashed rgba(210, 140, 90, 0.55);
    }

    .history-item:last-child {
      border-bottom: none;
    }

    .history-text {
      color: #6b360f;
      line-height: 1.5;
    }

    .history-meta {
      margin-top: 2px;
      font-size: 11px;
      color: #a67040;
      text-align: right;
    }

    .history-empty {
      text-align: center;
      color: #b38b5a;
      padding: 6px 0;
    }

    /* ===== 添加祝福表单 ===== */
    .form-section {
      margin-bottom: 10px;
      padding: 8px 10px;
      border-radius: 12px;
      border: 1px dashed #d58f3b;
      background: rgba(255, 251, 244, 0.96);
    }

    .form-title {
      font-size: 14px;
      font-weight: 600;
      color: #b30000;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }

    .form-title::before {
      content: "✍️";
      font-size: 14px;
    }

    .form-row {
      display: flex;
      flex-direction: column;
      gap: 4px;
      margin-bottom: 6px;
    }

    .form-row label {
      font-size: 12px;
      color: #8b4b16;
    }

    .form-row textarea,
    .form-row input {
      width: 100%;
      border-radius: 8px;
      border: 1px solid #e5b46b;
      padding: 6px 8px;
      font-size: 13px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
      background: #fffdf7;
    }

    .form-row textarea {
      resize: vertical;
      min-height: 50px;
      max-height: 120px;
    }

    .form-row textarea:focus,
    .form-row input:focus {
      border-color: #d17a26;
      box-shadow: 0 0 0 2px rgba(209, 122, 38, 0.2);
      background: #fff;
    }

    .form-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 2px;
    }

    .btn-small {
      border: none;
      border-radius: 999px;
      padding: 5px 14px;
      font-size: 12px;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s ease, transform 0.1s ease, box-shadow 0.1s ease;
    }

    .btn-small:active {
      transform: translateY(1px);
      box-shadow: none;
    }

    .btn-primary {
      background: #d17a26;
      color: #fffdf5;
      box-shadow: 0 3px 0 #9b5515;
    }

    .btn-primary:hover {
      background: #e18a34;
    }

    .btn-secondary {
      background: #f4e0bf;
      color: #6f4215;
      box-shadow: 0 3px 0 #c9a274;
    }

    .btn-secondary:hover {
      background: #f8e9cf;
    }

    .form-tip {
      margin-top: 4px;
      font-size: 11px;
      color: #a06a31;
    }

    /* ===== 页脚 ===== */
    .footer {
      margin-top: 4px;
      text-align: center;
      font-size: 11px;
      color: #a77045;
    }

    .footer span {
      color: #c0392b;
      font-family: "STKaiti", "KaiTi", "SimHei", sans-serif;
    }

    /* ===== 响应式调整（更宽设备） ===== */
    @media (min-width: 768px) {
      .app-container {
        padding: 20px 22px 22px;
      }

      .main-title {
        font-size: 34px;
      }

      .subtitle {
        font-size: 14px;
      }

      .blessing-card {
        padding: 20px 18px 18px;
        min-height: 140px;
      }

      .blessing-text {
        font-size: 16px;
      }

      .history-list {
        max-height: 220px;
      }

      .draw-btn {
        width: auto;
        padding: 12px 56px;
      }
    }

    @media (max-width: 400px) {
      body {
        padding: 12px 6px 20px;
      }
      .app-container {
        padding: 14px 10px 18px;
      }
      .main-title {
        font-size: 26px;
      }
      .blessing-card {
        padding: 14px 10px;
      }
      .blessing-text {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <div class="app-container">
    <div class="content-layer">
      <!-- ===== 顶部标题 ===== -->
      <header class="header">
        <h1 class="main-title">福愿传声，星火成林</h1>
        <div class="subtitle">扫码一抽，收集来自四面八方的温暖祝福</div>
        <div id="timeDisplay" class="time-display">— 加载当前时间中 —</div>
      </header>

      <!-- ===== 祝福显示区域 ===== -->
      <section class="blessing-section">
        <div class="section-title">今日锦鲤祝福</div>
        <div id="blessingCard" class="blessing-card">
          <!-- 四角小福字装饰 -->
          <div class="corner-fu tl">福</div>
          <div class="corner-fu tr">福</div>
          <div class="corner-fu bl">福</div>
          <div class="corner-fu br">福</div>

          <div id="blessingText" class="blessing-text placeholder">
            点击下方「抽取祝福」按钮，看看哪一条温暖会先来到你身边 ✨
          </div>
          <div id="blessingAuthor" class="blessing-author"></div>
        </div>
      </section>

      <!-- ===== 操作按钮 ===== -->
      <section class="actions">
        <button id="drawBtn" class="draw-btn">
          <span>抽取祝福</span>
        </button>
        <div class="helper-text">
          每条祝福只会被抽到一次，静静收集这一片小小星火。
        </div>
      </section>

      <!-- ===== 历史记录 ===== -->
      <section class="history-section">
        <div class="history-title">已抽到的祝福记录</div>
        <div id="historyList" class="history-list">
          <div class="history-empty">还没有抽到任何祝福，等待第一束小小星火点亮 🌟</div>
        </div>

      <!-- ===== 添加祝福表单 ===== -->

        <div class="form-title">添加一条属于你的祝福</div>

          </div>
          <div class="form-row">
            <label for="authorInput">署名（可选）：</label>
            <input id="authorInput" type="text" placeholder="如：小确幸、某某妈妈、来自XXX" />
          </div>
          <div class="form-actions">
            <button type="button" id="resetFormBtn" class="btn-small btn-secondary">清空</button>
            <button type="submit" class="btn-small btn-primary">加入祝福池</button>
          </div>
          <div class="form-tip">
            新增祝福仅保存在本次浏览器中，不会影响原始祝福列表。
          </div>
        </form>
      </section>

      <!-- ===== 页脚 ===== -->
      <footer class="footer">
        <div>愿每一声祝福，都成为你心里的<span>小小星火</span>，聚成一片温暖的森林。</div>
      </footer>
    </div>
  </div>

    function parseBlessings(rawList) {
  return rawList.map(item => {
    const parts = item.split("——");
    const text = parts[0].trim();
    const author = parts[1] ? parts[1].trim() : "";

    // 计算长度（这里只看文字长度，不含署名）
    const len = text.length;

    // 根据长度设置权重：
    // 你可以自己微调这个规则
    let weight = 1;
    if (len > 40 && len <= 80) {
      weight = 1.5;   // 中等偏长
    } else if (len > 80 && len <= 140) {
      weight = 2;     // 比较长
    } else if (len > 140) {
      weight = 2.5;   // 很长、很用心的祝福
    }

    return { text, author, weight };
  });
}


    let blessingsPool = parseBlessings(rawBlessings);

    // 时间显示
    function formatDateTime(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      const h = String(date.getHours()).padStart(2, "0");
      const mi = String(date.getMinutes()).padStart(2, "0");
      const s = String(date.getSeconds()).padStart(2, "0");
      const weekMap = ["日", "一", "二", "三", "四", "五", "六"];
      const w = weekMap[date.getDay()];
      return `${y}年${m}月${d}日 星期${w} ${h}:${mi}:${s}`;
    }

    function updateTime() {
      const now = new Date();
      timeDisplay.textContent = formatDateTime(now);
    }
    setInterval(updateTime, 1000);
    updateTime();

    // 背景音乐（首次交互后播放）
    function tryPlayBgm() {
      if (!bgm) return;
      bgm.volume = 0.4;
      bgm.play().catch(() => {});
    }

    // 抽取祝福
    function drawBlessing() {
      if (blessingsPool.length === 0) {
        blessingTextEl.textContent = "祝福已经全部抽完啦 🎉 这一片小小森林已经被你收集完全。";
        blessingTextEl.classList.remove("placeholder");
        blessingAuthorEl.textContent = "";
        drawBtn.classList.add("disabled");
        drawBtn.disabled = true;
        return;
      }

      const idx = Math.floor(Math.random() * blessingsPool.length);
      const [selected] = blessingsPool.splice(idx, 1);
      usedBlessings.push(selected);

      blessingCard.classList.remove("animating");
      void blessingCard.offsetWidth;
      blessingCard.classList.add("animating");

      blessingTextEl.textContent = selected.text;
      blessingTextEl.classList.remove("placeholder");
      blessingAuthorEl.textContent = selected.author ? `—— ${selected.author}` : "";

      const now = new Date();
      historyRecords.unshift({
        ...selected,
        time: formatDateTime(now),
      });
      renderHistory();
      triggerFireworks();
      tryPlayBgm();
    }

    drawBtn.addEventListener("click", () => {
      if (drawBtn.disabled) return;
      drawBlessing();
    });

    // 烟花
    function triggerFireworks() {
      const rect = blessingCard.getBoundingClientRect();
      const positions = [
        { x: rect.left + 16, y: rect.top + 16 },
        { x: rect.right - 16, y: rect.top + 16 },
        { x: rect.left + 16, y: rect.bottom - 16 },
        { x: rect.right - 16, y: rect.bottom - 16 },
      ];

      positions.forEach((pos, i) => {
        setTimeout(() => {
          createFireworkAt(pos.x, pos.y);
        }, i * 100);
      });
    }

    function createFireworkAt(x, y) {
      const fw = document.createElement("div");
      fw.className = "firework";
      fw.style.left = x + "px";
      fw.style.top = y + "px";
      document.body.appendChild(fw);
      setTimeout(() => fw.remove(), 700);
    }

    // 历史记录渲染
    function renderHistory() {
      historyListEl.innerHTML = "";
      if (historyRecords.length === 0) {
        const empty = document.createElement("div");

        empty.textContent = "还没有抽到任何祝福，等待第一束小小星火点亮 🌟";
        historyListEl.appendChild(empty);
        return;
      }
      historyRecords.forEach(rec => {
        const item = document.createElement("div");
        item.className = "history-item";

        const textDiv = document.createElement("div");
        textDiv.className = "history-text";
        textDiv.textContent = rec.text + (rec.author ? ` —— ${rec.author}` : "");

        const metaDiv = document.createElement("div");
        metaDiv.className = "history-meta";
        metaDiv.textContent = rec.time;

        item.appendChild(textDiv);
        item.appendChild(metaDiv);
        historyListEl.appendChild(item);
      });
    }

      authorInput.value = "";
